name: CI - Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Main / Promotion Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require promotion from testing
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "testing" ]]; then
            echo "Pull requests to main must originate from testing."
            exit 1
          fi

  release-validation:
    name: Main / Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate repository
        run: make syntax dependency-graph lint
      - name: Restore dependencies
        run: dotnet restore Alicia.slnx
      - name: Verify formatting
        run: dotnet format Alicia.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build Alicia.slnx --configuration Release --no-restore
      - name: Run Release tests
        run: dotnet test --solution Alicia.slnx --configuration Release --no-build --no-restore
      - name: Audit dependencies
        run: make audit

  required:
    name: Main / Required
    if: always()
    runs-on: ubuntu-latest
    needs: [promotion-policy, release-validation]
    steps:
      - name: Verify required jobs
        env:
          PROMOTION_RESULT: ${{ needs.promotion-policy.result }}
          RELEASE_RESULT: ${{ needs.release-validation.result }}
        run: |
          [[ "$PROMOTION_RESULT" == "success" ]]
          [[ "$RELEASE_RESULT" == "success" ]]

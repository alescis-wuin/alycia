services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alycia
      POSTGRES_USER: alycia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ALYCIA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ALYCIA_LOG_PATH: /app/logs/alycia-.jsonl
      ALYCIA_LOG_FILE_SIZE_BYTES: ${ALYCIA_LOG_FILE_SIZE_BYTES:-10485760}
      ALYCIA_LOG_RETAINED_FILES: ${ALYCIA_LOG_RETAINED_FILES:-14}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_logs:/app/logs

  s7-integration:
    profiles: ["test"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - .:/src
    environment:
      ALYCIA_S7_TEST_CONNECTION: "Host=postgres;Database=${ALYCIA_S7_TEST_DATABASE:-unused};Username=alycia;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    command: ["dotnet", "test", "tests/Alycia.OwnerInitialization.IntegrationTests/Alycia.OwnerInitialization.IntegrationTests.csproj", "--artifacts-path", "/tmp/alycia-artifacts"]

volumes:
  postgres_data:
  api_logs:
